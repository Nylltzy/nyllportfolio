name: Add SOLN project to portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill the websites slot
        run: |
          python3 - <<'PY'
          import pathlib

          CARD = """      <article class="slot slot--wide slot--filled reveal" data-tilt tabindex="0" aria-label="SOL'N landing page — website project 03, live">
                  <div class="slot__top">
                    <span class="slot__index">03</span>
                    <span class="slot__tag">Websites</span>
                  </div>

                  <div class="slot__frame slot__frame--wide slot__frame--filled">
                    <div class="slot__browser" aria-hidden="true">
                      <span></span><span></span><span></span>
                    </div>
                    <div class="slot__glow" aria-hidden="true"></div>
                    <div class="slot__brand">
                      <span class="slot__mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                          <defs>
                            <linearGradient id="solnMark" x1="0" y1="0" x2="1" y2="1">
                              <stop offset="0" stop-color="#5ce0c8"></stop>
                              <stop offset="1" stop-color="#7cb8e6"></stop>
                            </linearGradient>
                          </defs>
                          <path d="M8 5.5 15.5 12 8 18.5" stroke="url(#solnMark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
                          <circle cx="18.4" cy="12" r="1.7" fill="url(#solnMark)"></circle>
                        </svg>
                      </span>
                      <span class="slot__wordmark">SOL'N</span>
                      <span class="slot__tagline">Landing page · live</span>
                    </div>
                  </div>

                  <div class="slot__body">
                    <h3 class="slot__title">SOL'N</h3>
                    <p class="slot__text">A concept landing page built end to end — branded palette, chevron mark and a working inquiry form that saves every signup to a real database instead of a demo response.</p>
                    <ul class="slot__meta">
                      <li>React + Vite</li><li>Design &amp; build</li><li>2026</li>
                    </ul>
                    <a class="slot__cta" href="https://sol-n-b0yt4j.freebuff.site" target="_blank" rel="noopener">Visit the live site <span aria-hidden="true">↗</span></a>
                  </div>
                </article>"""

          CSS_LINES = [
              '',
              '/* filled slot - real project preview */',
              '.slot__frame--filled {',
              '  border-style: solid;',
              '  border-color: rgba(19, 17, 16, 0.2);',
              '  background:',
              '    radial-gradient(120% 130% at 50% 0%, #17253e 0%, #0c1424 58%, #070a14 100%);',
              '}',
              '',
              '.slot__frame--filled .slot__browser span { border-color: rgba(226, 238, 255, 0.4); }',
              '',
              '.slot__glow {',
              '  position: absolute;',
              '  inset: -30% -12% auto;',
              '  height: 80%;',
              '  background:',
              '    radial-gradient(50% 60% at 42% 0%, rgba(92, 224, 200, 0.34), transparent 70%),',
              '    radial-gradient(46% 56% at 72% 14%, rgba(124, 184, 230, 0.3), transparent 72%);',
              '  filter: blur(8px);',
              '  pointer-events: none;',
              '}',
              '',
              '.slot__brand {',
              '  position: relative;',
              '  display: grid;',
              '  justify-items: center;',
              '  gap: 10px;',
              '  transform: translateZ(18px);',
              '}',
              '',
              '.slot__mark {',
              '  display: grid;',
              '  place-items: center;',
              '  width: clamp(46px, 5vw, 66px);',
              '  aspect-ratio: 1;',
              '  border-radius: 14px;',
              '  border: 1px solid rgba(124, 184, 230, 0.3);',
              '  background: linear-gradient(160deg, #131c2e, #0b1220);',
              '  box-shadow: 0 16px 32px -14px rgba(0, 0, 0, 0.8);',
              '}',
              '',
              '.slot__mark svg { width: 60%; height: 60%; }',
              '',
              '.slot__wordmark {',
              '  font-family: var(--display);',
              '  font-size: clamp(28px, 4vw, 46px);',
              '  line-height: 1;',
              '  letter-spacing: 0.04em;',
              '  color: #f3f7ff;',
              '}',
              '',
              '.slot__tagline {',
              '  font-size: 10px;',
              '  letter-spacing: 0.18em;',
              '  text-transform: uppercase;',
              '  color: rgba(226, 238, 255, 0.55);',
              '}',
              '',
              '.slot__cta {',
              '  align-self: flex-start;',
              '  margin-top: 18px;',
              '  font-size: 11px;',
              '  letter-spacing: 0.14em;',
              '  text-transform: uppercase;',
              '  color: var(--ink);',
              '  border-bottom: 1px solid var(--line-strong);',
              '  padding-bottom: 4px;',
              '  transition: color 0.3s ease, border-color 0.3s ease;',
              '}',
              '',
              '.slot__cta:hover,',
              '.slot__cta:focus-visible {',
              '  color: var(--accent);',
              '  border-color: var(--accent);',
              '}',
          ]

          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')

          def sub(old, new):
              global s
              assert s.count(old) == 1, 'anchor not unique: ' + old[:40]
              s = s.replace(old, new)

          sub('Portfolio<br>03 slots open', 'Portfolio<br>02 slots open')
          sub('Three slots,<br>waiting to be filled.', 'One shipped,<br>two still open.')

          start = s.index('<article class="slot slot--wide reveal"')
          end = s.index('</article>', start) + len('</article>')
          s = s[:start] + CARD + s[end:]
          p.write_text(s, encoding='utf-8')

          c = pathlib.Path('styles.css')
          css = c.read_text(encoding='utf-8')
          anchor = '.slot__frame--wide { aspect-ratio: 21 / 9; }'
          assert css.count(anchor) == 1, 'css anchor not unique'
          extra = chr(10).join(CSS_LINES)
          c.write_text(css.replace(anchor, anchor + chr(10) + extra), encoding='utf-8')

          print('index.html', len(s), 'styles.css', len(css))
          PY

      - name: Commit and push
        run: |
          git diff --stat
          git config user.name "Nylltzy"
          git config user.email "152249429+Nylltzy@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Add SOLN landing page to selected work"
          git push
